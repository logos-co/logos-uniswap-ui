  .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

s is one of the commands.\n\n**What you'll learn:**\n\n- What the quote batch reads in one round trip, and what the reply carries\n- Why a swap from a token is two transactions and one approval\n- How the sender records each leg before it leaves, and what the rows carry\n- How to read the outcome back off the chain without trusting the sender\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```"}, {"execs": [], "md": "## Step 1: Build logosctl, Foundry and solc"}, {"execs": [{"cmd": "nix build \"github:logos-co/logos-logoscore-cli#ctl\" --out-link ./logos", "exit_code": 0, "kind": "run", "note": "", "output": "unpacking 'github:logos-co/logos-logoscore-cli/4e8c7395f631a89c4fb849a27bfda2b4157ed3d2' into the Git cache...\nunpacking 'github:logos-co/logos-test-modules/f54a5e866f71567a307291889dba598cfbe81d9c?narHash=sha256-xtcgdu7G1VO5Jt1gUmg9U%2BgcEOfuK7KYBtaNxEJCgZs%3D' into the Git cache...\nunpacking 'github:logos-co/logos-liblogos/cb9f27a0177412ad2714b08067d30eb967f6919d?narHash=sha256-cXAoKNLDVSmdalQFwkAnft%2BWXfMKyXG6Z8Qg9cZE89U%3D' into the Git cache...\nunpacking 'github:logos-co/logos-container-subprocess/5c6aefcf4f185c94a92fa1345221c211fde8ef84?narHash=sha256-bJLHdyQBld4AryXbSsKr%2BjcMf6os4xD%2BWL97ibdBn3A%3D' into the Git cache...\nunpacking 'github:logos-co/logos-module-loader-qt/dece0c8aa3b5a29a3457196988d672eda58750d7?narHash=sha256-qqmat4okKyimPdas%2BX212Ehz%2BVp2dT2ZeXBjbjYW/OQ%3D' into the Git cache...\nunpacking 'github:logos-co/logos-package-manager/3ad200d485c2d4510e41681231291a4899def181?narHash=sha256-BVL8zJRPzaZbG72KkD4eZZewcxx3n1ZVgxWGjV8cQGU%3D' into the Git cache...\nunpacking 'github:logos-co/logos-package/3cb520c8eadde3d6d7810dee74bdd243f73f34e9?narHash=sha256-h2ex453W73qjkN8n6Bo9ywU5X22bssmyCMpQjR5LRzY%3D' into the Git cache...\nunpacking 'github ogosctl call eth_rpc_module verify_chain_id 31337\n```"}, {"execs": [{"cmd": "echo doctest-pw > pw.txt\n./logos/bin/logosctl --config-dir ./session call evm_keystore_cli import_private_key ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 @pw.txt --human\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"address\":\"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\",\"ok\":true}\n", "status": "pass"}], "md": "### 4.3 Import Anvil's account 0\n\n```bash\nlogosctl call evm_keystore_cli import_private_key <privkey> @pw.txt\n```"}, {"execs": [], "md": "## Step 5: A pool to swap against\n\nThree contracts, deployed from Anvil's account 9: a minimal ERC-20 (`TKN`), a\n**mock V2 router** that holds a pool of TKN against ether and prices it as a\nconstant product \u2014 `getAmountsOut` for quotes, `swapExactTokensForETH` and\n`swapExactETHForTokens` for swaps, the four functions the module speaks \u2014 and a\n`Multicall3` with `aggregate3` and `getEthBalance`, which the quote batch goes\nthrough. The pool holds 1,000,000 TKN against 100 ETH; account 0 holds 1000 TKN."}, {"execs": [{"cmd": "write Mocks.sol", "kind": "file", "note": "Wrote Mocks.sol", "status": "pass"}], "md": "### 5.1 Write the contracts\n\n```\n// SPDX-License-Identifier: MIT\npragma solidity ^0.8.19;\ncontract MockERC20 {\n    string public name = \"Test Token\"; string public symbol = \"TKN\"; uint8 public decimals = 18;\n    uint256 public totalSupply;\n    mapping(address => uint256) public balanceOf;\n    mapping(address => mapping(address => uint256)) public allowance;\n    event Transfer(address indexed from, address indexed to, uint256 value);\n    event Approval(address indexed owner, address indexed spender, uint256 value);\n    function mint(address to, uint256 amt) external { balanceOf[to] += amt; totalSupply += amt; emit Transfer(address(0), to, amt); }\n    function transfer(address to, uint256 amt) external returns (bool) { balanceOf[msg.sender] -= amt; balanceOf[to] += amt; emit Transfer(msg.sender, to, amt); return true; }\n    function approve(address sp, uint256 amt) external returns (bool) { allowance[msg.sender][sp] = amt; emit Approval(msg.sender, sp, amt); return true; }\n    function transferFrom(address f, address to, uint256 amt) external returns (bool) { allowance[f][msg.sender] -= amt; balanceOf[f] -= amt; balanceOf[to] += amt; emit Transfer(f, to, amt); return true; }\n}\n// A V2 router that is its own pool: TKN against the ether it holds, priced as a\n// constant product with no fee. Paths are two addresses, token and WETH.\ncontract MockV2Router {\n    MockERC20 public immutable token;\n    address public immutable WETH;\n    constructor(MockERC20 t, address weth) { token = t; WETH = weth; }\n    receive() external payable {}\n    function out(uint256 amountIn, uint256 rIn, uint256 rOut) internal pure returns (uint256) { return rOut * amountIn / (rIn + amountIn); }\n    function getAmountsOut(uint256 amountIn, address[] calldata path) external view returns (uint256[] memory amounts) {\n        amounts = new uint256[](path.length); amounts[0] = amountIn;\n        if (path[0] == address(token)) amounts[path.length - 1] = out(amountIn, token.balanceOf(address(this)), address(this).balance);\n        else amounts[path.length - 1] = out(amountIn, address(this).balance, token.balanceOf(address(this)));\n    }\n    function swapExactTokensForETH(uint256 amountIn, uint256 amountOutMin, address[] calldata path, address to, uint256 deadline) external returns (uint256[] memory amounts) {\n        require(block.timestamp <= deadline, \"expired\"); require(path[0] == address(token), \"path\");\n        uint256 got = out(amountIn, token.balanceOf(address(this)), address(this).balance);\n        require(got >= amountOutMin, \"slippage\");\n        token.transferFrom(msg.sender, address(this), amountIn);\n        (bool ok,) = to.call{value: got}(\"\"); require(ok, \"eth\");\n        amounts = new uint256[](2); amounts[0] = amountIn; amounts[1] = got;\n    }\n    function swapExactETHForTokens(uint256 amountOutMin, address[] calldata path, address to, uint256 deadline) external payable returns (uint256[] memory amounts) {\n        require(block.timestamp <= deadline, \"expired\"); require(path[path.length - 1] == address(token), \"path\");\n        uint256 got = out(msg.value, address(this).balance - msg.value, token.balanceOf(address(this)));\n        require(got >= amountOutMin, \"slippage\");\n        token.transfer(to, got);\n        amounts = new uint256[](2); amounts[0] = msg.value; amounts[1] = got;\n    }\n}\ncontract Multicall3 {\n    struct Call3 { address target; bool allowFailure; bytes callData; }\n    struct Result { bool success; bytes returnData; }\n    function aggregate3(Call3[] calldata calls) external payable returns (Result[] memory returnData) {\n        returnData = new Result[](calls.length);\n        for (uint256 i = 0; i < calls.length; i++) {\n            (bool ok, bytes memory ret) = calls[i].target.call(calls[i].callData);\n            require(ok || calls[i].allowFailure, \"Multicall3: call failed\");\n            returnData[i] = Result(ok, ret);\n        }\n    }\n    function getEthBalance(address addr) external view returns (uint256) { return addr.balance; }\n}\n```"}, {"execs": [{"cmd": "set -e\nexport PATH=\"$PWD/foundry/bin:$PATH\"\nRPC=http://127.0.0.1:8545\nPK9=0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6\nACC0=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\nWETH=0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2\n./solc/bin/solc --combined-json bin --optimize Mocks.sol > solc.json\nbin() { python3 -c \"import json,sys; print(json.load(open('solc.json'))['contracts']['Mocks.sol:$1']['bin'])\"; }\ndeploy() { cast send --rpc-url $RPC --private-key $PK9 --create \"$1\" --json | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"contractAddress\"])'; }\nTKN=$(deploy \"0x$(bin MockERC20)\")\nCTOR=$(cast abi-encode 'c(address,address)' $TKN $WETH)\nROUTER=$(deploy \"0x$(bin MockV2Router)${CTOR#0x}\")\nMC=$(deploy \"0x$(bin Multicall3)\")\ncast send --rpc-url $RPC --private-key $PK9 $TKN \"mint(address,uint256)\" $ROUTER 1000000000000000000000000 >/dev/null\ncast send --rpc-url $RPC --private-key $PK9 $TKN \"mint(address,uint256)\" $ACC0 1000000000000000000000 >/dev/null\ncast send --rpc-url $RPC --private-key $PK9 --value 100000000000000000000 $ROUTER >/dev/null\necho \"$TKN\" > tkn.txt; echo \"$ROUTER\" > router.txt; echo \"$MC\" > mc.txt\necho \"token=$TKN router=$ROUTER multicall=$MC\"\necho \"pool_tkn=$(cast call --rpc-url $RPC $TKN 'balanceOf(address)(uint256)' $ROUTER) pool_eth=$(cast balance --rpc-url $RPC $ROUTER)\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "token=0x700b6a60ce7eaaea56f065753d8dcb9653dbad35 router=0xa15bb66138824a1c7167f5e85b957d04dd34e468 multicall=0xb19b36b1456e65e3a6d514d3f715f204bd59f431\npool_tkn=1000000000000000000000000 [1e24] pool_eth=100000000000000000000\n", "status": "pass"}], "md": "### 5.2 Deploy them and fill the pool\n\n```bash\nsolc --combined-json bin --optimize Mocks.sol > solc.json\ncast send --private-key <acc9> --create 0x<bin>        # MockERC20, MockV2Router, Multicall3\ncast send --private-key <acc9> <TKN> \"mint(address,uint256)\" <ROUTER> 1000000e18\ncast send --private-key <acc9> <TKN> \"mint(address,uint256)\" 0xf39F\u20262266 1000e18\ncast send --private-key <acc9> --value 100e18 <ROUTER>\n```"}, {"execs": [{"cmd": "python3 -c '\nimport json\njson.dump({\"chainId\": 31337, \"weth\": \"0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2\",\n           \"stablecoins\": [open(\"tkn.txt\").read().strip()], \"multicall3\": open(\"mc.txt\").read().strip(),\n           \"v2Router\": open(\"router.txt\").read().strip()}, open(\"uni_chain.json\", \"w\"))'\n./logos/bin/logosctl --config-dir ./session call uniswap_module configure @uni_chain.json --human\n", "exit_code": 0, "kind": "run", "note": "", "output": "true\n", "status": "pass"}], "md": "### 5.3 Tell the Uniswap module about this chain\n\nA V2-only deployment: the mock router, the mock Multicall3, and TKN as the\n\"stablecoin\" (the field the pricing side anchors on; it is not used here).\n\n```bash\nlogosctl call uniswap_module configure '{\"chainId\":31337,\"weth\":\"0xC02a\u20266Cc2\",\"stablecoins\":[\"<TKN>\"],\"multicall3\":\"<MC>\",\"v2Router\":\"<ROUTER>\"}'\n```"}, {"execs": [], "md": "## Step 6: Quote and build\n\n1000 TKN for ether, for account 0. One Multicall3 round trip reads the V2 quote, a\nprobe of a thousandth of it, the account's TKN balance and its allowance for the\nrouter. The pool is 1,000,000 TKN against 100 ETH, so 1000 TKN fetches about\n0.0999 ETH, and the trade itself moves the price by a tenth of a percent \u2014 10\nbasis points, which is what `priceImpactBps` reports."}, {"execs": [{"cmd": "python3 -c '\nimport json\njson.dump({\"tokenIn\": open(\"tkn.txt\").read().strip(), \"tokenOut\": \"ETH\", \"amountIn\": \"1000000000000000000000\",\n           \"owner\": \"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266\", \"symbolIn\": \"TKN\", \"symbolOut\": \"ETH\"},\n          open(\"swap.json\", \"w\"))'\n./logos/bin/logosctl --config-dir ./session call uniswap_module quote_swap 31337 @swap.json --human | tee quote.json\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"allowance\":\"0\",\"amountIn\":\"1000000000000000000000\",\"amountOut\":\"99900099900099900\",\"approval\":\"set\",\"balanceIn\":\"1000000000000000000000\",\"chainId\":31337,\"feeBps\":30,\"gasLimitHint\":180000,\"needsApproval\":true,\"ok\":true,\"priceImpactBps\":10,\"route\":{\"hops\":[{\"tokenIn\":\"0x700b6A60ce7EaaEA56F065753d8dcB9653dbAD35\",\"tokenOut\":\"0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2\"}],\"version\":\"V2\",\"viaWeth\":false},\"rpcRoute\":\"direct\",\"spender\":\"0xA15BB66138824a1c7167f5E85b957d04Dd34E468\",\"tokenIn\":\"0x700b6a60ce7eaaea56f065753d8dcb9653dbad35\",\"tokenOut\":\"ETH\"}\n", "status": "pass"}], "md": "### 6.1 Quote\n\n```bash\nlogosc <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
